services:

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: users

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./user-service

    ports:
      - "8000:8000"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: users

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: